<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Alerta y Prevención de Desastres naturales en Perú</title>
    <meta name="description" content="Sistema integral de alerta y evacuación ante sismos, tsunamis, huaicos, inundaciones, heladas, sequías y erupciones volcánicas para los 24 departamentos, Callao, 196 provincias y 1893 distritos del Perú." />
    <meta property="og:title" content="Alerta y Prevención de Desastres naturales en Perú" />
    <meta property="og:description" content="Sistema integral de alerta y evacuación ante sismos, tsunamis, huaicos, inundaciones, heladas, sequías y erupciones volcánicas para los 24 departamentos, Callao, 196 provincias y 1893 distritos del Perú." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alerta Perú" />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('alerta_peru_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && systemDark)) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0b0f19');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f172a');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased selection:bg-red-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
